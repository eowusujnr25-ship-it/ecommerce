<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">My Ecommerce</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row bg-white p-4 shadow-sm rounded">
        <div class="col-md-6 text-center">
            <img th:src="${product.imageUrl}" class="img-fluid rounded" alt="Product Image" style="max-height: 500px;">
        </div>
        <div class="mt-5">
            <a th:href="@{/product/edit/{id}(id=${product.id})}" class="btn btn-warning btn-lg px-5">Edit Product</a>
            <button class="btn btn-success btn-lg px-5">Add to Cart</button>
            <a href="/" class="btn btn-outline-secondary btn-lg">Back to Shop</a>
        </div>


        <div class="col-md-6">
            <h1 class="display-5" th:text="${product.name}">Product Name</h1>
            <h3 class="text-primary mb-4" th:text="'£' + ${product.price}">£0.00</h3>
            <hr>
            <h5>Description</h5>
            <p class="lead" th:text="${product.description}">Product description goes here...</p>

            <div class="mt-5">
                <button class="btn btn-success btn-lg px-5">Add to Cart</button>
                <a href="/" class="btn btn-outline-secondary btn-lg">Back to Shop</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
