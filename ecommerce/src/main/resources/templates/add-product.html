<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow p-4">
            <h3 class="mb-4 text-center">Add New Product</h3>

            <form th:action="@{/save-product}" th:object="${product}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. HP Laptop" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price ($)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="0.00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="Paste link here...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>


                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Save Product</button>
                    <a href="/" class="btn btn-secondary">Back to Store</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
