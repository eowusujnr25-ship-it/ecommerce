<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tech Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .product-card { transition: transform 0.2s; }
        .product-card:hover { transform: scale(1.03); }
        .card-img-top { height: 200px; object-fit: contain; padding: 10px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">My Ecommerce</a>
        <a th:href="@{/add-product}" class="btn btn-outline-light">Add Product</a>
    </div>
</nav>

<div class="row">
    <div class="col-md-4" th:each="product : ${listProducts}">
        <div class="card mb-4">
            <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image">

            <div class="card-body">
                <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                <p class="card-text" th:text="'$' + ${product.price}">$0.00</p>

                <a th:href="@{'/cart/add/' + ${product.id}}" class="btn btn-primary">
                    Add to Cart
                </a>


            </div>
        </div>
    </div>
</div>
</body>
</html>
